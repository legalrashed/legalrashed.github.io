        * {

            margin: 0;
            padding: 0;
            font-family: 'Calibri', 'Segoe UI', sans-serif;
            font-style: normal !important;
        }

        body {
            background: #1C2026;
            background: linear-gradient(180deg, #1C2026 0%, #2B303A 25%, #20242B 50%, #3B0D11 75%, #4A0000 100%);
            background-attachment: fixed;
            color: #ffffff;

            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        header {
            text-align: center;
            padding: 30px 15px;
        }

        .profile-link {
            text-decoration: none;
            color: white;
            display: inline-block;
        }

        .avatar-ring {
            width: 120px;
            height: 120px;
            margin: 0 auto 12px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #1E232A, #C8102E, #8B0000);
            box-shadow: 0 0 20px rgba(200, 16, 46, 0.4);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background: #C8102E;
        }

        .profile-title {
            font-family: 'Book Antiqua', 'Palatino', serif;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .profile-subtitle {
            font-family: 'Garamond', serif;
            color: #f87171;
            font-size: 16px;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Main Glass Card */
        main {
            flex: 1;
            max-width: 1100px;
            width: 92%;
            margin: 0 auto 40px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 30px;
            color: #1E293B;
            border: 2px solid rgba(200, 16, 46, 0.3);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .section-header {
            text-align: center;
            border-bottom: 1px solid #fee2e2;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .section-header h2 {
            font-family: 'Book Antiqua', serif;
            font-size: 26px;
            color: #1E232A;
        }

        .section-header p {
            font-family: 'Garamond', serif;
            color: #475569;
            font-size: 16px;
            margin-top: 4px;
        }

        .divider {
            width: 80px;
            height: 4px;
            background: #C8102E;
            margin: 10px auto 0;
            border-radius: 2px;
        }

            font-size: 18px;
            color: #1E232A;
        }
