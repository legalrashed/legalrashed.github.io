<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Photo Gallery | Capital Law Chamber</title>
    <link rel="icon" type="image/jpeg" href="favicon_.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        azureBlue: '#C8102E',    /* Signature Capital Law Chamber Red */
                        navyBlue: '#1E232A',     /* Dark Charcoal Accent */
                        deepGreen: '#8B0000',    /* Dark Crimson Red */
                        darkText: '#1E293B',     /* Slate Dark Text */
                        subtleGray: '#475569',   /* Muted Text Gray */
                        fbBlue: '#1877F2',       /* Official Facebook Blue */
                    },
                    fontFamily: {
                        algerian: ['Algerian', 'Impact', 'Copperplate Gothic Bold', 'Georgia', 'serif'],
                        bookAntiqua: ['"Book Antiqua"', 'Palatino', 'Georgia', 'serif'],
                        garamond: ['Garamond', 'Georgia', 'serif'],
                        calibri: ['Calibri', 'Candara', 'Segoe UI', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .font-algerian { font-family: Algerian, Impact, 'Copperplate Gothic Bold', Georgia, serif; font-style: normal !important; }
        .font-bookAntiqua { font-family: 'Book Antiqua', Palatino, 'Palatino Linotype', Georgia, serif; font-style: normal !important; }
        .font-garamond { font-family: Garamond, Georgia, serif; font-style: normal !important; }
        .font-calibri { font-family: Calibri, Candara, 'Segoe UI', sans-serif; font-style: normal !important; }

        * { font-style: normal !important; }

        /* Background matching site continuous gradient */
        body {
            background: linear-gradient(180deg, #1C2026 0%, #2B303A 20%, #20242B 45%, #3B0D11 75%, #4A0000 90%, #2B0000 100%) !important;
            background-attachment: fixed;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1C2026; }
        ::-webkit-scrollbar-thumb { background: #C8102E; border-radius: 4px; }

        .glass-card-light {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(200, 16, 46, 0.2);
        }

        .photo-glow { box-shadow: 0 0 25px rgba(200, 16, 46, 0.4); }

        /* Dynamic Border Effects for Albums */
        .dynamic-border-chamber {
            border: 2px solid transparent;
            background: linear-gradient(white, white) padding-box, linear-gradient(135deg, #C8102E, #1E232A) border-box;
        }
        .dynamic-border-chamber:hover {
            box-shadow: 0 10px 25px -5px rgba(200, 16, 46, 0.4);
            transform: translateY(-4px);
        }

        .dynamic-border-litigation {
            border: 2px solid transparent;
            background: linear-gradient(white, white) padding-box, linear-gradient(135deg, #8B0000, #C8102E) border-box;
        }
        .dynamic-border-litigation:hover {
            box-shadow: 0 10px 25px -5px rgba(139, 0, 0, 0.4);
            transform: translateY(-4px);
        }

        .dynamic-border-events {
            border: 2px solid transparent;
            background: linear-gradient(white, white) padding-box, linear-gradient(135deg, #D97706, #C8102E) border-box;
        }
        .dynamic-border-events:hover {
            box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.4);
            transform: translateY(-4px);
        }

        .dynamic-border-meetings {
            border: 2px solid transparent;
            background: linear-gradient(white, white) padding-box, linear-gradient(135deg, #2563EB, #1E232A) border-box;
        }
        .dynamic-border-meetings:hover {
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
            transform: translateY(-4px);
        }
